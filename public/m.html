<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>NYC Trains · Go</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    html, body { height:100%; background:#000; }
    body {
      color:#e8e8e8;
      font-family:'Courier New', Courier, monospace;
      font-weight:bold;
      font-size:16px;
      display:flex;
      flex-direction:column;
      height:100vh;
      height:100dvh;
      overflow:hidden;
      -webkit-user-select:none; user-select:none;
    }

    button { font-family:inherit; font-weight:inherit; color:inherit; background:transparent; border:1px solid #3a3a3a; }

    /* ── Header: logo + breadcrumbs ── */
    #head {
      flex-shrink:0;
      padding:calc(10px + env(safe-area-inset-top)) 12px 8px;
      border-bottom:1px solid #2a2a2a;
    }
    #head-top { display:flex; align-items:center; margin-bottom:8px; }
    #logo { width:22px; height:22px; margin-right:10px; flex-shrink:0; }
    #status { flex:1; font-size:11px; letter-spacing:1px; color:#8a8a8a; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    #crumbs { display:flex; gap:6px; }
    .crumb {
      flex:1 1 0; min-width:0;
      padding:8px 6px;
      font-size:12px; letter-spacing:1px; text-transform:uppercase;
      text-align:left;
      color:#777;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .crumb .n { color:#555; margin-right:4px; }
    .crumb.done { color:#cfcfcf; }
    .crumb.cur  { color:#fff; border-color:#9a9a9a; }
    .dots { display:inline-block; vertical-align:middle; }
    .dots i { display:inline-block; width:9px; height:9px; border-radius:5px; margin-right:3px; }

    /* ── List ── */
    #list-head {
      flex-shrink:0;
      padding:10px 12px 6px;
      font-size:12px; letter-spacing:3px; text-transform:uppercase; color:#8a8a8a;
      display:flex; justify-content:space-between;
    }
    #list { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }

    .row {
      display:flex; align-items:center;
      padding:10px 12px;
      border-bottom:1px solid #121212;
    }
    .row:first-child { padding-top:14px; }
    .badge {
      width:44px; height:44px; border-radius:22px; flex-shrink:0;
      text-align:center; line-height:44px; font-size:22px;
    }
    .row .mins { flex:1; padding-left:16px; font-size:28px; color:#e8e8e8; }
    .row .mins small { font-size:15px; color:#9a9a9a; }
    .row.soon .mins { color:#6ee7b7; }
    .row .clk { font-size:15px; color:#8a8a8a; }
    .row.far .badge { width:36px; height:36px; line-height:36px; font-size:18px; border-radius:18px; margin:0 4px; }
    .row.far .mins { font-size:20px; color:#bbb; }

    .msg { padding:28px 16px; font-size:14px; letter-spacing:2px; color:#6a6a6a; text-transform:uppercase; line-height:1.6; }

    /* ── Dial ── */
    #dock { flex-shrink:0; border-top:1px solid #2a2a2a; padding-bottom:env(safe-area-inset-bottom); background:#000; }
    #dock.min #dial-wrap { display:none; }
    #adjust { display:none; width:100%; padding:16px 0; font-size:14px; letter-spacing:4px; text-transform:uppercase; border:0; color:#cfcfcf; }
    #dock.min #adjust { display:block; }

    #readout { text-align:center; padding:10px 12px 0; min-height:92px; }
    #readout .big { font-size:20px; letter-spacing:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #readout .sub { font-size:12px; letter-spacing:2px; color:#8a8a8a; margin-top:3px; text-transform:uppercase; }

    #readout .dest { display:flex; align-items:center; justify-content:center; gap:6px; font-size:13px; color:#cfcfcf; margin-top:4px; white-space:nowrap; }
    #readout .dest .nm { overflow:hidden; text-overflow:ellipsis; letter-spacing:0; }
    #readout .dest .mb { display:inline-block; width:18px; height:18px; border-radius:9px; font-size:10px; line-height:18px; text-align:center; margin-right:2px; }
    #dial { position:relative; height:232px; overflow:hidden; touch-action:none; }
    .item {
      position:absolute; left:50%; top:0;
      min-width:64px; max-width:130px; height:40px; padding:0 10px;
      border-radius:20px;
      font-size:13px; letter-spacing:1px; text-transform:uppercase;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      display:block;
      transition:transform .18s ease-out, opacity .18s;
      will-change:transform;
    }
    #dial.drag .item { transition:none; }
    .item.sel { border-color:#fff; color:#fff; }
    .item.sw { width:44px; min-width:44px; height:44px; border-radius:22px; padding:0; border:2px solid transparent; font-size:18px; letter-spacing:0; }
    .item.sw.sel { border-color:#fff; }
    .item.sw.off { opacity:.25 !important; background:#000 !important; color:#888 !important; border:2px solid #444 !important; }

    #center {
      position:absolute; left:50%; width:84px; height:84px; margin-left:-42px;
      border-radius:42px; font-size:15px; letter-spacing:2px; text-transform:uppercase;
      border:2px solid #cfcfcf; color:#fff; background:#000;
    }
    #center:active { background:#222; }
    #back, #done {
      position:absolute; bottom:12px;
      padding:12px 14px; font-size:12px; letter-spacing:2px; text-transform:uppercase; color:#aaa;
    }
    #back { left:12px; }
    #done { right:12px; }
    #back[hidden], #done[hidden] { display:none; }
  </style>
</head>
<body>

<div id="head">
  <div id="head-top">
    <svg id="logo" viewBox="0 0 376 376" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M109.521 343.817L145.115 159.979L123.993 169.757V212.392H83.7052V141.986L163.89 110.303C167.28 108.999 170.474 108.152 173.473 107.761C176.472 107.37 179.536 107.174 182.665 107.174C190.227 107.174 196.812 108.934 202.418 112.454C208.024 115.975 212.914 120.603 217.086 126.34L221.389 131.425C226.865 139.509 233.253 148.375 240.555 158.023C247.856 167.671 263.502 172.495 287.492 172.495V212.392C270.803 212.392 255.483 210.045 241.533 205.352C227.582 200.658 216.825 193.748 209.263 184.621L204.569 213.957L231.167 240.946V343.817H191.27V264.023L171.713 244.857L148.635 343.817H109.521ZM183.643 86.0521C176.211 78.4899 172.495 69.2328 172.495 58.2807C172.495 47.3286 176.211 38.1367 183.643 30.7049C191.075 23.2732 200.267 19.5573 211.219 19.5573C222.171 19.5573 231.428 23.2732 238.99 30.7049C246.552 38.1367 250.333 47.3286 250.333 58.2807C250.333 69.2328 246.552 78.4899 238.99 86.0521C231.428 93.6142 222.171 97.3953 211.219 97.3953C200.267 97.3953 191.075 93.6142 183.643 86.0521Z" fill="white"/>
    </svg>
    <div id="status">locating…</div>
  </div>
  <div id="crumbs">
    <button class="crumb" id="c0"></button>
    <button class="crumb" id="c1"></button>
    <button class="crumb" id="c2"></button>
  </div>
</div>

<div id="list-head"><span id="lh-l"></span><span id="lh-r"></span></div>
<div id="list"></div>

<div id="dock">
  <button id="adjust">[ adjust ]</button>
  <div id="dial-wrap">
    <div id="readout"><div class="big" id="ro-big"></div><div class="sub" id="ro-sub"></div></div>
    <div id="dial">
      <button id="center">go</button>
      <button id="back">&lsaquo; back</button>
      <button id="done" hidden>done &rsaquo;</button>
    </div>
  </div>
</div>

<script>
// ── Constants ─────────────────────────────────────
var NEARBY_COUNT = 8;
var POLL_MS = 20000;
var TIMES_SQ = { lat: 40.7553, lon: -73.9875 };

// Color groups in display order. 'lines' is the label; 'routes' what belongs to it.
var GROUPS = [
  { key:'blue',   bg:'#0039A6', fg:'#fff', routes:['A','C','E'] },
  { key:'orange', bg:'#FF6319', fg:'#fff', routes:['B','D','F','M'] },
  { key:'yellow', bg:'#FCCC0A', fg:'#000', routes:['N','Q','R','W'] },
  { key:'red',    bg:'#EE352E', fg:'#fff', routes:['1','2','3'] },
  { key:'green',  bg:'#00933C', fg:'#fff', routes:['4','5','6'] },
  { key:'purple', bg:'#B933AD', fg:'#fff', routes:['7'] },
  { key:'lime',   bg:'#6CBE45', fg:'#000', routes:['G'] },
  { key:'brown',  bg:'#996633', fg:'#fff', routes:['J','Z'] },
  { key:'grey',   bg:'#A7A9AC', fg:'#000', routes:['L'] },
  { key:'shuttle',bg:'#808183', fg:'#fff', routes:['S','GS','FS','H'] },
  { key:'si',     bg:'#0078C6', fg:'#fff', routes:['SI'] }
];
var GROUP_OF = {};
GROUPS.forEach(function(g) { g.routes.forEach(function(r) { GROUP_OF[r] = g; }); });

function groupOf(route) {
  return GROUP_OF[route] || GROUP_OF[route.replace(/X$/, '')] || GROUPS[GROUPS.length - 1];
}
function badgeFor(route) {
  var g = groupOf(route);
  return '<span class="badge" style="background:' + g.bg + ';color:' + g.fg + '">' +
         route.replace(/X$/, '') + '</span>';
}

// ── State ─────────────────────────────────────────
var store = {
  get: function(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: function(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

var all = [];                 // every station
var nearby = [];              // nearest few, with .dist (meters)
var gpsOk = false;
var pos = null;

var sel = {
  stationId: store.get('m.station'),
  dir: store.get('m.dir') || 'N',
  off: (function() { try { return JSON.parse(store.get('m.off') || '{}'); } catch (e) { return {}; } })()
};
var step = 0;                 // 0 station, 1 direction, 2 colors, 3 done
var arrivals = [];
var listState = 'idle';       // idle | loading | ok | error
var fetchedAt = 0;

function station() {
  for (var i = 0; i < all.length; i++) if (all[i].id === sel.stationId) return all[i];
  return null;
}
function stationGroups(st) {
  var seen = {}, out = [];
  st.routes.forEach(function(r) { seen[groupOf(r).key] = true; });
  GROUPS.forEach(function(g) { if (seen[g.key]) out.push(g); });
  return out;
}
function groupLetters(g, st) {
  return st.routes.filter(function(r) { return groupOf(r) === g && !/X$/.test(r); }).join('');
}

// ── Helpers ───────────────────────────────────────
function $(id) { return document.getElementById(id); }
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function clockStr(ts) {
  var d = new Date(ts * 1000), h = d.getHours() % 12 || 12;
  return h + ':' + pad(d.getMinutes()) + (d.getHours() < 12 ? 'a' : 'p');
}
function nowStr() {
  var d = new Date(), h = d.getHours() % 12 || 12;
  return h + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}
function haversine(aLat, aLon, bLat, bLon) {
  var R = 6371000, r = Math.PI / 180;
  var dLat = (bLat - aLat) * r, dLon = (bLon - aLon) * r;
  var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos(aLat * r) * Math.cos(bLat * r) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
  return 2 * R * Math.asin(Math.sqrt(h));
}
function distLabel(m) {
  if (m < 160) return Math.round(m / 10) * 10 + ' m';
  return (m / 1609).toFixed(1) + ' mi';
}
function esc(s) { return String(s).replace(/[&<>"]/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function dirName(d) { return d === 'N' ? 'Uptown' : 'Downtown'; }

// ── Location ──────────────────────────────────────
function rankNearby() {
  var p = pos || TIMES_SQ;
  var ranked = all.map(function(s) {
    return { s: s, dist: haversine(p.lat, p.lon, s.lat, s.lon) };
  }).sort(function(a, b) { return a.dist - b.dist; });
  nearby = ranked.slice(0, NEARBY_COUNT).map(function(r) {
    var o = Object.create(r.s); o.dist = r.dist; return o;
  });
}

function locate() {
  $('status').textContent = 'locating…';
  if (!navigator.geolocation) { noGps('no gps on this device'); return; }
  navigator.geolocation.getCurrentPosition(function(p) {
    gpsOk = true;
    pos = { lat: p.coords.latitude, lon: p.coords.longitude };
    rankNearby();
    $('status').textContent = 'gps · ' + nearby.length + ' stations near you';
    if (step === 0) openStep(0);
  }, function() {
    noGps('gps off · showing midtown');
  }, { enableHighAccuracy: false, timeout: 8000, maximumAge: 60000 });
}
function noGps(msg) {
  gpsOk = false;
  var st = station();
  pos = st ? { lat: st.lat, lon: st.lon } : null;
  rankNearby();
  $('status').textContent = msg;
  if (step === 0) openStep(0);
}

// ── Arrivals ──────────────────────────────────────
var pollTimer = null;
function fetchArrivals() {
  var st = station();
  if (!st) return;
  var id = st.id;
  if (listState !== 'ok') { listState = 'loading'; renderList(); }
  var xhr = new XMLHttpRequest();
  xhr.open('GET', '/station?id=' + encodeURIComponent(id), true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4 || id !== sel.stationId) return;
    if (xhr.status === 200) {
      try {
        var d = JSON.parse(xhr.responseText);
        arrivals = (d.arrivals || []).sort(function(a, b) { return a.ts - b.ts; });
        fetchedAt = Date.now();
        listState = (d.feedErrors && !arrivals.length) ? 'error' : 'ok';
      } catch (e) { listState = 'error'; }
    } else {
      listState = 'error';
    }
    renderList();
    if (step === 1) onDialMove();
  };
  xhr.send();
}
function startPolling() {
  clearInterval(pollTimer);
  pollTimer = setInterval(fetchArrivals, POLL_MS);
}

// ── List ──────────────────────────────────────────

function renderList() {
  var st = station();
  var el = $('list');
  $('lh-l').textContent = st ? dirName(sel.dir) : '';
  $('lh-r').textContent = (listState === 'ok' && fetchedAt) ? 'upd ' + nowStr() : '';

  if (!st) { el.innerHTML = '<div class="msg">pick a station with the dial below</div>'; return; }
  if (listState === 'loading') { el.innerHTML = '<div class="msg">loading trains…</div>'; return; }
  if (listState === 'error')   { el.innerHTML = '<div class="msg">can\'t reach train data<br>retrying every ' + (POLL_MS / 1000) + 's</div>'; return; }

  var nowTs = Date.now() / 1000;
  var rows = arrivals.filter(function(a) {
    return a.dir === sel.dir && !sel.off[groupOf(a.line).key] && (a.ts - nowTs) / 60 > -0.5;
  }).slice(0, 14);

  if (!rows.length) { el.innerHTML = '<div class="msg">no trains in the next 40 min<br>for these colors</div>'; return; }

  var html = '';
  rows.forEach(function(a, i) {
    var mins = (a.ts - nowTs) / 60;
    var label = mins < 0.5 ? 'now' : Math.max(1, Math.round(mins)) + '<small> min</small>';
    html += '<div class="row' + (i > 3 ? ' far' : '') + (mins < 2 ? ' soon' : '') + '">' +
            badgeFor(a.line) +
            '<div class="mins">' + label + '</div>' +
            '<div class="clk">' + clockStr(a.ts) + '</div></div>';
  });
  el.innerHTML = html;
}

// ── Crumbs ────────────────────────────────────────
function renderCrumbs() {
  var st = station();
  var c = [$('c0'), $('c1'), $('c2')];
  c[0].innerHTML = '<span class="n">1</span>' + (st ? esc(st.name) : 'station');
  c[1].innerHTML = '<span class="n">2</span>' + (st ? dirName(sel.dir) : 'up/down');
  var dots = '';
  if (st) {
    stationGroups(st).forEach(function(g) {
      dots += '<i style="background:' + (sel.off[g.key] ? 'transparent;border:1px solid ' + g.bg : g.bg) + '"></i>';
    });
  }
  c[2].innerHTML = '<span class="n">3</span><span class="dots">' + (dots || 'colors') + '</span>';
  for (var i = 0; i < 3; i++) {
    c[i].className = 'crumb' + (step === i ? ' cur' : (i < step || (st && step === 3) ? ' done' : ''));
    c[i].disabled = (i > 0 && !st);
  }
}
$('c0').onclick = function() { openStep(0); };
$('c1').onclick = function() { openStep(1); };
$('c2').onclick = function() { openStep(2); };

// Where trains in one direction are headed, grouped by destination (most trains first)
function destinations(dir) {
  var by = {};
  arrivals.forEach(function(a) {
    if (a.dir !== dir || a.end || !a.to) return;
    var d = by[a.to] = by[a.to] || { to: a.to, n: 0, lines: {} };
    d.n++;
    d.lines[a.line.replace(/X$/, '')] = true;
  });
  return Object.keys(by).map(function(k) { return by[k]; })
    .sort(function(x, y) { return y.n - x.n; }).slice(0, 3);
}
function destHtml(dir) {
  if (listState === 'loading') return '<div class="dest">loading destinations…</div>';
  var ds = destinations(dir);
  if (!ds.length) return '';
  return ds.map(function(d) {
    var chips = Object.keys(d.lines).sort().map(function(l) {
      var g = groupOf(l);
      return '<span class="mb" style="background:' + g.bg + ';color:' + g.fg + '">' + l + '</span>';
    }).join('');
    return '<div class="dest">' + chips + '<span class="nm">to ' + esc(d.to) + '</span></div>';
  }).join('');
}

// ── Dial ──────────────────────────────────────────
var STEP_DEG = 32;
var RADIUS   = 150;
var ORIGIN_FROM_BOTTOM = 50;

var dial = { items: [], els: [], f: 0, idx: 0, kind: '' };

function dialOrigin() {
  var r = $('dial').getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.bottom - ORIGIN_FROM_BOTTOM, w: r.width, h: r.height };
}

function buildDial(kind, items, startIdx) {
  var host = $('dial');
  dial.els.forEach(function(e) { host.removeChild(e); });
  dial.els = []; dial.items = items; dial.kind = kind;
  items.forEach(function(it, i) {
    var b = document.createElement('button');
    b.className = 'item' + (it.sw ? ' sw' : '');
    if (it.sw) { b.style.background = it.bg; b.style.color = it.fg; }
    b.textContent = it.label;
    b.onclick = function() { if (!moved) { snapTo(i); } };
    host.insertBefore(b, $('center'));
    dial.els.push(b);
  });
  dial.f = dial.idx = Math.max(0, Math.min(items.length - 1, startIdx || 0));
  paintDial();
}

function paintDial() {
  var n = dial.items.length;
  var oy = $('dial').clientHeight - ORIGIN_FROM_BOTTOM;
  for (var i = 0; i < n; i++) {
    var rel = i - dial.f;
    var deg = rel * STEP_DEG;
    var vis = Math.abs(deg) <= 78;
    var a = (-90 + deg) * Math.PI / 180;
    var x = RADIUS * Math.cos(a), y = oy + RADIUS * Math.sin(a);
    var s = 1 - Math.min(Math.abs(rel), 2) * 0.12;
    var el = dial.els[i];
    el.style.transform = 'translate(-50%,0) translate(' + x.toFixed(1) + 'px,' + (y - 20).toFixed(1) + 'px) scale(' + s.toFixed(2) + ')';
    el.style.opacity = vis ? (1 - Math.min(Math.abs(rel), 2.4) * 0.3).toFixed(2) : 0;
    el.style.pointerEvents = vis ? 'auto' : 'none';
    var it = dial.items[i];
    el.className = 'item' + (it.sw ? ' sw' : '') + (i === Math.round(dial.f) ? ' sel' : '') +
                   (it.sw && sel.off[it.id] ? ' off' : '');
  }
  $('center').style.top = (oy - 42) + 'px';
  var cur = Math.round(dial.f);
  if (cur !== dial.idx) {
    dial.idx = cur;
    if (navigator.vibrate) navigator.vibrate(8);
    onDialMove();
  }
}

function snapTo(i) {
  dial.f = Math.max(0, Math.min(dial.items.length - 1, i));
  paintDial();
}

// gestures
var drag = null, moved = false;
function ang(e) {
  var o = dialOrigin();
  return Math.atan2(e.clientY - o.y, e.clientX - o.x) * 180 / Math.PI;
}
$('dial').addEventListener('pointerdown', function(e) {
  if (e.target.id === 'center' || e.target.id === 'back' || e.target.id === 'done') return;
  drag = { a: ang(e), x: e.clientX, y: e.clientY };
  moved = false;
  drag.id = e.pointerId;
});
$('dial').addEventListener('pointermove', function(e) {
  if (!drag) return;
  if (!moved && Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 6) {
    moved = true;
    drag.a = ang(e);
    $('dial').classList.add('drag');
    try { $('dial').setPointerCapture(drag.id); } catch (x) {}
    return;
  }
  if (!moved) return;
  var a = ang(e), d = a - drag.a;
  if (d > 180) d -= 360;
  if (d < -180) d += 360;
  drag.a = a;
  dial.f = Math.max(0, Math.min(dial.items.length - 1, dial.f - d / STEP_DEG));
  paintDial();
});
function endDrag() {
  if (!drag) return;
  drag = null;
  $('dial').classList.remove('drag');
  snapTo(Math.round(dial.f));
  setTimeout(function() { moved = false; }, 0);
}
$('dial').addEventListener('pointerup', endDrag);
$('dial').addEventListener('pointercancel', endDrag);

// ── Steps ─────────────────────────────────────────
function openStep(n) {
  step = n;
  $('dock').className = '';
  $('back').hidden = (n === 0);
  $('done').hidden = (n !== 2);

  if (n === 0) {
    var items = nearby.map(function(s) { return { id: s.id, label: s.name }; });
    var start = 0;
    nearby.forEach(function(s, i) { if (s.id === sel.stationId) start = i; });
    $('center').textContent = 'go';
    buildDial('station', items, start);
  } else if (n === 1) {
    $('center').textContent = 'go';
    buildDial('dir', [
      { id: 'N', label: 'Uptown' },
      { id: 'S', label: 'Downtown' }
    ], sel.dir === 'S' ? 1 : 0);
  } else if (n === 2) {
    var st = station();
    var items2 = stationGroups(st).map(function(g) {
      return { id: g.key, label: groupLetters(g, st).charAt(0) || '•', sw: true, bg: g.bg, fg: g.fg, g: g };
    });
    $('center').textContent = '';
    buildDial('color', items2, 0);
  }
  onDialMove();
  renderCrumbs();
}

function onDialMove() {
  var it = dial.items[dial.idx];
  if (!it) { $('ro-big').textContent = ''; $('ro-sub').textContent = ''; return; }
  var st = station();
  if (dial.kind === 'station') {
    var s = nearby[dial.idx];
    $('ro-big').textContent = s.name;
    $('ro-sub').textContent = (gpsOk ? distLabel(s.dist) + ' · ' : '') + s.routes.filter(function(r) { return !/X$/.test(r); }).join(' ');
  } else if (dial.kind === 'dir') {
    $('ro-big').textContent = dirName(it.id);
    $('ro-sub').innerHTML = destHtml(it.id);
  } else if (dial.kind === 'color') {
    var on = !sel.off[it.id];
    $('ro-big').textContent = groupLetters(it.g, st).split('').join(' ');
    $('ro-sub').textContent = on ? 'showing · tap center to hide' : 'hidden · tap center to show';
    $('center').textContent = on ? 'on' : 'off';
  }
}

function confirm() {
  var it = dial.items[dial.idx];
  if (!it) return;
  if (dial.kind === 'station') {
    var changed = sel.stationId !== it.id;
    sel.stationId = it.id;
    store.set('m.station', it.id);
    if (changed) { sel.off = {}; store.set('m.off', '{}'); }
    arrivals = []; listState = 'loading'; fetchedAt = 0;
    fetchArrivals(); startPolling();
    renderList();
    openStep(1);
  } else if (dial.kind === 'dir') {
    sel.dir = it.id;
    store.set('m.dir', sel.dir);
    renderList();
    openStep(2);
  } else if (dial.kind === 'color') {
    if (sel.off[it.id]) delete sel.off[it.id]; else sel.off[it.id] = true;
    store.set('m.off', JSON.stringify(sel.off));
    paintDial();
    onDialMove();
    renderCrumbs();
    renderList();
  }
}

$('center').onclick = confirm;
$('back').onclick = function() { openStep(Math.max(0, step - 1)); };
$('done').onclick = function() {
  step = 3;
  $('dock').className = 'min';
  renderCrumbs();
};
$('adjust').onclick = function() { openStep(0); };

// ── Boot ──────────────────────────────────────────
function tick() {
  if (step !== 0 || station()) renderList();
}
setInterval(tick, 5000);
document.addEventListener('visibilitychange', function() {
  if (!document.hidden && station()) fetchArrivals();
});
window.addEventListener('resize', function() { if (dial.items.length) paintDial(); });

(function boot() {
  renderCrumbs();
  renderList();
  var xhr = new XMLHttpRequest();
  xhr.open('GET', '/stations.json', true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    if (xhr.status !== 200) { $('status').textContent = 'station list failed'; return; }
    all = JSON.parse(xhr.responseText);
    var st = station();
    if (st) {
      // returning visitor: show their trains immediately, dial stays out of the way
      pos = { lat: st.lat, lon: st.lon };
      rankNearby();
      listState = 'loading';
      fetchArrivals(); startPolling();
      renderList();
      step = 3;
      $('dock').className = 'min';
      renderCrumbs();
      locate();
    } else {
      rankNearby();
      openStep(0);
      locate();
    }
  };
  xhr.send();
})();
</script>
</body>
</html>
